[package]
name = "solidcore-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"
description = "Standalone wgpu viewer for actual Rust STEP construction candidates"

[dependencies]
solidcore = { path = "../solidcore" }
solidcore-step = { path = "../solidcore-step" }
solidcore-step-native = { path = "../solidcore-step-native" }
wgpu = "=30.0.1"
winit = "=0.30.13"
egui = { version = "=0.37.0", default-features = false }
egui-wgpu = { version = "=0.37.0", default-features = false }
egui-winit = { version = "=0.37.0", default-features = false }
glam = "=0.33.12"
pollster = "=1.0.1"
earcutr = "=0.5.0"
png = "=0.18.1"

[lints]
workspace = true
